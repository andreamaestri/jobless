{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Delete obstacle" %} — Jobless{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col">
  <div class="flex-1 overflow-y-auto pb-20">
    <div class="p-4 sm:p-6 md:p-8 lg:py-12 lg:px-8">
      <div class="max-w-xl mx-auto">
        <div class="bg-base-100/80 shadow-xl rounded-2xl p-6 sm:p-8">
          <h1 class="text-xl font-bold mb-4">{% translate "Delete obstacle?" %}</h1>
          <p class="mb-6">{% translate "This cannot be undone." %}</p>
          <form method="post" class="flex justify-end gap-3">
            {% csrf_token %}
            <a href="{% url 'jobs:nachweis' %}" class="btn btn-ghost">{% translate "Cancel" %}</a>
            <button type="submit" class="btn btn-error">{% translate "Delete" %}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
