{% load static %}
{% load i18n %}

<div class="skill-tree-widget" x-data="skillSelector">
    <!-- Error Messages -->
    <div x-show="errors.length > 0" class="alert alert-error mb-4">
        <template x-for="error in errors" :key="error">
            <div class="flex items-center gap-2">
                <iconify-icon icon="heroicons:exclamation-circle" class="text-lg"></iconify-icon>
                <span x-text="error"></span>
            </div>
        </template>
    </div>

    <!-- Search/Tree Mode Toggle -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-4">
        <div class="flex items-center space-x-4">
            <div class="tabs tabs-box bg-base-200">
                <button type="button" class="tab"
                        :class="{ 'tab-active': viewMode === 'search' }"
                        @click="viewMode = 'search'">
                    <iconify-icon icon="heroicons:magnifying-glass" class="text-lg"></iconify-icon>
                    <span class="ml-2">{% translate "Search" %}</span>
                </button>
                <button type="button" class="tab"
                        :class="{ 'tab-active': viewMode === 'tree' }"
                        @click="viewMode = 'tree'">
                    <iconify-icon icon="heroicons:squares-2x2" class="text-lg"></iconify-icon>
                    <span class="ml-2">{% translate "Categories" %}</span>
                </button>
            </div>
        </div>
        <div class="text-sm text-base-content/70"
             :aria-label="selectedSkills.length + ' selected'"
             x-text="selectedSkills.length + ' selected'">
        </div>
    </div>

    <div x-show="selectedSkills.length > 0" class="flex flex-wrap gap-2 mb-4" aria-live="polite">
        <template x-for="skill in selectedSkills" :key="skill.id">
                    <button type="button"
                    class="badge badge-primary badge-outline gap-1"
                    @click="removeSkill(skill); updateFormField(); dispatchSkillUpdate()"
                    :aria-label="`${gettext('Remove')} ${skill.label}`">
                <span x-text="skill.label_de && skill.label_de !== skill.label ? skill.label_de : skill.label"></span>
                <iconify-icon icon="heroicons:x-mark" aria-hidden="true"></iconify-icon>
            </button>
        </template>
    </div>

    <!-- Search View -->
    <div x-show="viewMode === 'search'" class="space-y-4">
        <div class="join w-full">
            <input type="search"
                   placeholder="{% translate 'Search skills ...' %}"
                   class="input join-item grow"
                   x-model.trim="searchQuery"
                   aria-controls="skill-search-results">
            <button type="button" class="btn btn-square join-item" @click="searchQuery = ''"
                    x-show="searchQuery" :aria-label="gettext('Clear search')">
                <iconify-icon icon="heroicons:magnifying-glass" class="text-lg"></iconify-icon>
            </button>
        </div>
        <div id="skill-search-results" class="grid grid-cols-1 sm:grid-cols-2 gap-2"
             x-show="filteredSkills.length > 0">
            <template x-for="skill in filteredSkills" :key="skill.id">
                <div class="dropdown dropdown-hover">
                    <button type="button" class="btn btn-sm justify-start gap-2 normal-case w-full"
                            @click="toggleSkill(skill)"
                            :class="{
                                'btn-primary': isSelected(skill.id),
                                'btn-ghost': !isSelected(skill.id)
                            }">
                        <iconify-icon :icon="skill.icon" class="text-lg"></iconify-icon>
                        <span x-text="skill.label_de && skill.label_de !== skill.label ? skill.label_de : skill.label" class="flex-1 text-left"></span>
                        <template x-if="isSelected(skill.id)">
                            <iconify-icon :icon="proficiencyLevels.find(p => p.value === getSkillProficiency(skill.id))?.icon"
                                        class="text-lg"></iconify-icon>
                        </template>
                    </button>
                    <div class="dropdown-content z-[1] menu p-2 shadow bg-base-200 rounded-box w-52"
                         x-show="isSelected(skill.id)">
                        <div class="mb-2 text-sm font-medium text-base-content/70">{% translate "Proficiency Level" %}</div>
                        <template x-for="level in proficiencyLevels" :key="level.value">
                            <button type="button" class="btn btn-sm justify-start gap-2 normal-case w-full mb-1"
                                    :class="{'btn-primary': getSkillProficiency(skill.id) === level.value}"
                                    @click.stop="updateSkill({...skill, proficiency: level.value})">
                                <iconify-icon :icon="level.icon" class="text-lg"></iconify-icon>
                                <span x-text="level.label"></span>
                            </button>
                        </template>
                        <div class="divider my-1"></div>
                        <button type="button" class="btn btn-sm btn-error justify-start gap-2 normal-case w-full"
                                @click.stop="removeSkill(skill)">
                            <iconify-icon icon="heroicons:trash" class="text-lg"></iconify-icon>
                            <span>{% translate "Remove" %}</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
        <div x-show="filteredSkills.length === 0"
             class="text-center py-8 text-base-content/70">
            {% translate "No skills found matching your search" %}
        </div>
    </div>

    <!-- Tree View -->
    <div x-show="viewMode === 'tree'" class="space-y-4">
        <template x-for="category in categories" :key="category.path">
            <div class="card bg-base-200">
                <div class="card-body p-4">
                    <button type="button" class="flex items-center gap-2 w-full text-left"
                            @click="toggleCategory(category)"
                            :aria-expanded="category.expanded"
                            :aria-controls="`category-${category.path.replaceAll('/', '-')}`">
                        <iconify-icon :icon="category.expanded ? 'heroicons:chevron-down' : 'heroicons:chevron-right'"
                                    class="text-lg" aria-hidden="true"></iconify-icon>
                        <h3 class="card-title text-base" x-text="category.label"></h3>
                        <template x-if="category.mangelberufCount > 0">
                            <span class="badge badge-sm badge-warning" x-text="category.mangelberufCount + ' Mangelberufe'"></span>
                        </template>
                        <span class="badge badge-ghost badge-sm ml-auto" x-text="category.count"></span>
                    </button>
                    <div x-show="category.expanded" x-collapse
                         :id="`category-${category.path.replaceAll('/', '-')}`">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4">
                            <template x-for="skill in category.skills" :key="skill.id">
                                <button type="button" class="btn btn-sm justify-start gap-2 normal-case"
                                        :class="isSelected(skill.id) ? 'btn-primary' : 'btn-ghost'"
                                        @click="toggleSkill(skill)">
                                    <iconify-icon :icon="skill.icon" class="text-lg"></iconify-icon>
                                    <span x-text="skill.label_de && skill.label_de !== skill.label ? skill.label_de : skill.label"></span>
                                    <template x-if="skill.is_mangelberuf">
                                        <span class="badge badge-xs badge-warning">M</span>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Hidden Input for Form Submission -->
    <input type="hidden" name="skills" :value="skillsJson">
</div>
